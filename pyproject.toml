[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Julien M", email = "julien.mallard@berger-levrault.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.1.1",
    "sqlalchemy>=2.0.46",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
